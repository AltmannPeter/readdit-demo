[package]
name = "nym-profile"
version = "0.1.0"
edition = "2024"
description = "The sampling profiler of /tech: which functions a proof spends its time in"
publish = false

[dependencies]
# The sampler (SIGPROF and a stack walk; its own unsafe code, none here).
pprof = { version = "0.15", default-features = false }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
