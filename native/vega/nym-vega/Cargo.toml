[package]
name = "nym-vega"
version = "0.1.0"
edition = "2024"
description = "Prover and verifier of the nym_auth age and pseudonym statement (Vega), as Community runs them"
publish = false

[dependencies]
vega-age = { path = "../vega-age" }
# The proof's serialization, as the prover serializes it.
bincode = "1.3"
# circuits/mdoc/shapes.zst.
zstd = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
# CircuitZkPresentation (rulebook, "Presentation encoding"), read from untrusted input.
ciborium = "0.2"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
# The device key's ES256 signature (RFC 6979 nonces), the issuer and device signature checks.
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
# The Document Signer certificate in issuer_key_set.
x509-cert = "0.2"
der = "0.7"
# The site's clock (RFC 3339).
time = { version = "0.3", features = ["parsing", "formatting"] }
# The prover's thread count, which the metrics report.
rayon = "1.12"
# vega-prover's phase spans, which /tech's profile records (phases.rs).
tracing = "0.1"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
