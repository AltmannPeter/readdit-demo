[package]
name = "community-longfellow-node"
version = "0.1.0"
edition = "2024"
description = "Node addon: the nym_auth Longfellow prover and verifier for Community's server"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
nym-longfellow = { path = "../nym-longfellow" }
# /tech's Profiling switch: the sampling profiler, shared by the three addons.
nym-profile = { path = "../../nym-profile" }
napi = { version = "3", features = ["napi8"] }
napi-derive = "3"
serde = "1"
serde_json = "1"

[build-dependencies]
napi-build = "2"

# napi-derive's #[napi] expansion emits the unsafe FFI glue between Node-API and Rust, so this
# crate cannot forbid unsafe code. Its own source has none (`grep -n unsafe node/src` is empty);
# every computation lives in nym-longfellow, which forbids it.
[lints.rust]
unsafe_code = "allow"
unused_must_use = "deny"

[lints.clippy]
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
