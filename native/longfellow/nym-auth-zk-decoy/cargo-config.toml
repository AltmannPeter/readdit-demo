# Copy to .cargo/config.toml for fast local builds.
# Google's Longfellow runtime uses the CPU's carry-less multiply (PCLMULQDQ) for GF(2^128) only when
# the build enables it: a generic x86-64 build proves about 5x slower. `-sha` keeps small SHA-256
# calls fast on x86 VMs where the SHA extension mixes badly with the native vector code.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=native", "-C", "target-feature=-sha"]
[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]
