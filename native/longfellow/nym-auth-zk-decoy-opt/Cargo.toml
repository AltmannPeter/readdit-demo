[package]
name = "nym-auth-zk-decoy-opt"
version = "0.2.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "nym-auth-zk-decoy 0.1.0 with two prover changes (P1: the Ligero table's subfield rows packed; P2: an AES-256-CTR random engine behind the feature aes-rng). The same circuits, system_id and proofs. Longfellow zero-knowledge presentations of the nym_auth mdoc attestation (eu.europa.ec.eudi.nym_auth.1) in the decoy-digest layout with the precomputed prefix: age range check on the committed birth date and the known-offender-matching-ssc pseudonym, in one proof. Two Longfellow circuits (LFC2 in an LFA2 archive), their native witness generator, and Google's ZK prover and verifier with their independent work in parallel."

[dependencies]
# Google's Longfellow Rust implementation: circuits (LFC2/LFA2), fields, the ZK prover and
# verifier (Ligero + sumcheck), the Fiat-Shamir transcript and the proof encoding.
core-proto = { git = "https://github.com/google/longfellow-zk", rev = "61a8a735964d1b22bccf79bf14ef6767249cdf92" }
core-algebra = { git = "https://github.com/google/longfellow-zk", rev = "61a8a735964d1b22bccf79bf14ef6767249cdf92" }
runtime-algebra = { git = "https://github.com/google/longfellow-zk", rev = "61a8a735964d1b22bccf79bf14ef6767249cdf92" }
runtime-zk = { git = "https://github.com/google/longfellow-zk", rev = "61a8a735964d1b22bccf79bf14ef6767249cdf92" }
runtime-random = { git = "https://github.com/google/longfellow-zk", rev = "61a8a735964d1b22bccf79bf14ef6767249cdf92" }
runtime-ligero = { git = "https://github.com/google/longfellow-zk", rev = "61a8a735964d1b22bccf79bf14ef6767249cdf92" }
runtime-proto = { git = "https://github.com/google/longfellow-zk", rev = "61a8a735964d1b22bccf79bf14ef6767249cdf92" }
runtime-sumcheck = { git = "https://github.com/google/longfellow-zk", rev = "61a8a735964d1b22bccf79bf14ef6767249cdf92" }
runtime-merkle = { git = "https://github.com/google/longfellow-zk", rev = "61a8a735964d1b22bccf79bf14ef6767249cdf92" }
# The parallel prover and verifier's thread pool (feature `parallel`).
rayon = { version = "1.10", optional = true }
# The circuit archive is zstd-compressed, as Google's mdoc circuits are shipped.
zstd = "0.13"
# P2 (feature `aes-rng`): AES-256 for the keystream (its key schedule zeroised on drop), the OS
# CSPRNG for the key.
aes = { version = "0.8.4", features = ["zeroize"], optional = true }
zeroize = { version = "1", optional = true }
getrandom = { version = "0.3", optional = true }
# SHA-256 (the transcript-independent hashes: verifier_input, the session's handover, e2).
sha2 = "0.10"
# P-256 field and scalar arithmetic for the signature circuit's witness; ECDSA verification for
# the prover's checks before proving.
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "expose-field", "ecdsa"] }

[features]
# Independent proving and verification work in parallel on the calling rayon pool. Without it,
# the same work runs in order on the calling thread; the output is identical.
default = ["parallel"]
parallel = ["dep:rayon"]
# Google's own ZkProver / ZkVerifier in place of the parallel copies (for comparison tests).
reference = []
# P2, for benchmarks: `AesCtrRng`, a random engine drawing from AES-256-CTR under a key from the
# OS CSPRNG (one OS call per proof instead of one per draw). Off by default.
aes-rng = ["dep:aes", "dep:zeroize", "dep:getrandom"]
# Google's ZkVerifier in place of the parallel copy, with the parallel, packed prover (gates:
# packed proofs against Google's verifier).
google-verifier = []

[dev-dependencies]
serde_json = "1"
# Google's deterministic random engine, for the byte-identity example and tests only.
runtime-random = { git = "https://github.com/google/longfellow-zk", rev = "61a8a735964d1b22bccf79bf14ef6767249cdf92", features = ["testonly"] }

# examples/compare.rs: the unmodified v0.6 crate as the baseline, a thread pool of a given size,
# and the process's peak resident set (getrusage).
nym-auth-zk-decoy = { path = "../nym-auth-zk-decoy" }
rayon = "1.10"
libc = "0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(aes_armv8)"] }
