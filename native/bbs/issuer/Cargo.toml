[package]
name = "bbs-issuer"
version = "0.1.0"
edition = "2021"
description = "Issues Readdit's demo BBS credential (mms_zk) and writes the issuer parameters"
publish = false

[dependencies]
nym-bbs = { path = "../nym-bbs" }
bbs-cd-plugin.workspace = true
cd-ecdsa-pop.workspace = true
cd-date-range.workspace = true
cd-pseudonym.workspace = true
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"
