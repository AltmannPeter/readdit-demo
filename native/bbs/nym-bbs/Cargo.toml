[package]
name = "nym-bbs"
version = "0.1.0"
edition = "2021"
description = "Community: the nym_auth attestation in its bbs_cd encoding, presented as zkp_req (prover and verifier)"
publish = false

[dependencies]
bbs-cd.workspace = true
bbs-cd-plugin.workspace = true
cd-tom256.workspace = true
cd-ecdsa-pop.workspace = true
cd-date-range.workspace = true
cd-pseudonym.workspace = true
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
ciborium = "0.2"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
