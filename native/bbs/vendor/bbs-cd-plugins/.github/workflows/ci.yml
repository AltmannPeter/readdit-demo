name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt,clippy
          rustup default ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Tests (default features)
        run: cargo test --locked --release --workspace
      - name: Tests (all features)
        run: cargo test --locked --release --workspace --all-features
      - name: ETSI conformance
        run: bash crates/bbs-cd/ci/check.sh ${{ matrix.toolchain }}
