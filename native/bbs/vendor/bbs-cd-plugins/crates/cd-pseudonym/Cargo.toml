[package]
name = "cd-pseudonym"
description = "Pseudonym plugin for BBS committed disclosures: a per-relying-party pseudonym from a committed, issuer-known seed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Malicious-holder proof construction, for attack tests only.  MUST NOT be
# enabled in a build you ship.  Only the `malicious` test target requires it
# (run it with `--all-features`).
insecure-test-controls = []

[dependencies]
bbs-cd.workspace = true
bbs-cd-plugin.workspace = true
bls12_381.workspace = true
rand_core.workspace = true

[dev-dependencies]
cd-ecdsa-pop.workspace = true
cd-date-range.workspace = true
cd-tom256.workspace = true

[[test]]
name = "malicious"
required-features = ["insecure-test-controls"]
