[package]
name = "cd-date-range"
description = "Date-range plugin for BBS committed disclosures: prove that a committed date (for example a birth date) lies in a requested range, without revealing it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Malicious-holder proof construction (arbitrary digits and openings), for
# attack tests only.  MUST NOT be enabled in a build you ship.  Only the
# `malicious` test target requires it (run it with `--all-features`).
insecure-test-controls = []

[dependencies]
bbs-cd.workspace = true
bbs-cd-plugin.workspace = true
bls12_381.workspace = true
rand_core.workspace = true

[dev-dependencies]
cd-ecdsa-pop.workspace = true
cd-pseudonym.workspace = true
cd-tom256.workspace = true

[[bin]]
name = "date-range-bench"
path = "src/bin/date-range-bench.rs"

[[test]]
name = "malicious"
required-features = ["insecure-test-controls"]
