[package]
name = "bbs-cd"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "bbs_cd"
path = "src/lib.rs"

[dependencies]
bls12_381 = { version = "=0.9.0", default-features = false, features = ["groups", "pairings", "alloc", "experimental"] }
# Windowed (wNAF) scalar multiplication from the curve library's own group
# crate; used on the holder and verifier paths (see src/helpers.rs).
group = { version = "0.14", default-features = false, features = ["alloc"] }
sha2 = "0.10"
sha3 = "0.10"
getrandom = "0.4"
serde_json = "1.0"
