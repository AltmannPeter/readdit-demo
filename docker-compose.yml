# Readdit demo in a container: the site with its two proof backends built in (Rust addons: Vega and BBS).
#
#   docker compose up -d --build        http://localhost:3000   (the first build takes several minutes)
#   docker compose down
#
# There are no separate prover and verifier containers or profiles: the site's server runs them in process.
services:
  web:
    build: .
    ports: ["3000:3000"]
